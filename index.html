<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <!-- Meta / OG tags (카카오톡 등 크롤러는 JS를 실행하지 않으므로 정적으로 값 고정) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="서상우 ♥ 이정은 결혼합니다">
  <meta property="og:description" content="2026년 12월 12일, 소중한 분들을 초대합니다.">
  <meta property="og:image" content="https://leelingo.github.io/wedding/images/og/1.JPG">
  <meta property="og:url" content="https://leelingo.github.io/wedding/">
  <meta name="description" content="2026년 12월 12일, 소중한 분들을 초대합니다.">

  <title>Wedding Invitation</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Meie+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>

  <!-- ─── Toast ─── -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- ─── Photo Viewer Modal ─── -->
  <div id="photoModal" class="photo-modal" role="dialog" aria-modal="true" aria-label="사진 보기">
    <button class="photo-modal__close" id="modalClose" aria-label="닫기">&times;</button>
    <button class="photo-modal__nav photo-modal__nav--prev" id="modalPrev" aria-label="이전 사진">&#8249;</button>
    <button class="photo-modal__nav photo-modal__nav--next" id="modalNext" aria-label="다음 사진">&#8250;</button>
    <div class="photo-modal__container" id="modalContainer">
      <img class="photo-modal__img" id="modalImg" src="" alt="사진" draggable="false">
    </div>
    <div class="photo-modal__counter" id="modalCounter"></div>
  </div>

  <!-- ─── Main Content ─── -->
  <main id="mainContent" class="main-content">

    <!-- Hero Section -->
    <section class="section hero" id="hero">
      <img class="hero__photo" id="heroPhoto" src="" alt="웨딩 사진" loading="eager">
      <div class="hero__snow" id="heroSnow" aria-hidden="true"></div>
    </section>

    <!-- Greeting Section -->
    <section class="section greeting" id="greeting">
      <div class="section__inner">
        <p class="section__eyebrow animate-item" data-animate="fade-up">INVITATION</p>
        <h2 class="section__title animate-item" data-animate="fade-up" id="greetingTitle"></h2>
        <p class="greeting__quote animate-item" data-animate="fade-up" id="greetingQuote"></p>
        <p class="greeting__text animate-item" data-animate="fade-up" id="greetingContent"></p>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <div class="greeting__parents animate-item" data-animate="fade-up" id="greetingParents"></div>
      </div>
    </section>

    <!-- Interview Section -->
    <section class="section interview" id="interview">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up" id="interviewTitle"></h2>
        <p class="section__subtitle animate-item" data-animate="fade-up" id="interviewSubtitle"></p>
        <div class="interview__photos animate-item" data-animate="fade-up">
          <div class="interview__photo"><img id="interviewGroomPhoto" src="" alt="신랑" loading="lazy"></div>
          <div class="interview__photo"><img id="interviewBridePhoto" src="" alt="신부" loading="lazy"></div>
        </div>
      </div>
    </section>

    <!-- Calendar / D-day Section -->
    <section class="section calendar-section" id="calendarSection">
      <div class="section__inner">
        <p class="calendar__date-heading animate-item" data-animate="fade-up" id="calendarDateHeading"></p>
        <p class="calendar__date-sub animate-item" data-animate="fade-up" id="calendarDateSub"></p>
        <div class="calendar animate-item" data-animate="fade-up" id="calendarGrid"></div>
        <p class="countdown__desc animate-item" data-animate="fade-up" id="countdownDesc"></p>
      </div>
    </section>

    <!-- Location Section -->
    <section class="section location" id="location">
      <div class="section__inner">
        <p class="section__eyebrow animate-item" data-animate="fade-up">LOCATION</p>
        <h2 class="section__title animate-item" data-animate="fade-up">오시는 길</h2>
        <div class="location__info animate-item" data-animate="fade-up">
          <p class="location__venue" id="locationVenue"></p>
          <p class="location__address" id="locationAddress"></p>
        </div>
        <button class="btn btn--text location__copy animate-item" data-animate="fade-up" id="copyAddressBtn">주소 복사</button>
        <div class="location__map animate-item" data-animate="fade-in">
          <img class="location__map-img" id="locationMapImg" src="" alt="약도" loading="lazy">
        </div>
        <div class="location__links animate-item" data-animate="fade-up">
          <a class="btn btn--outline" id="naverMapBtn" href="#" target="_blank" rel="noopener">네이버지도</a>
        </div>

        <div class="location__transit" id="locationTransit">
          <div class="location__transit-group animate-item" data-animate="fade-up" id="locationSubwayGroup">
            <div class="location__transit-divider"></div>
            <h3 class="location__transit-title">지하철</h3>
            <ul class="location__transit-list" id="locationSubwayList"></ul>
            <p class="location__transit-note" id="locationSubwayNote"></p>
          </div>
          <div class="location__transit-group animate-item" data-animate="fade-up" id="locationBusGroup">
            <div class="location__transit-divider"></div>
            <h3 class="location__transit-title">버스</h3>
            <p class="location__transit-note" id="locationShuttleNote"></p>
            <ul class="location__transit-list" id="locationBusList"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Gallery Section -->
    <section class="section gallery" id="gallery">
      <div class="section__inner">
        <p class="section__eyebrow animate-item" data-animate="fade-up">GALLERY</p>
        <h2 class="section__title animate-item" data-animate="fade-up">웨딩 갤러리</h2>
      </div>
      <div class="gallery__carousel animate-item" data-animate="fade-up" id="galleryCarousel">
        <div class="gallery__main">
          <button class="gallery__nav gallery__nav--prev" id="galleryPrevBtn" aria-label="이전 사진">&#8249;</button>
          <img class="gallery__main-img" id="galleryMainImg" src="" alt="갤러리 사진" loading="lazy">
          <button class="gallery__nav gallery__nav--next" id="galleryNextBtn" aria-label="다음 사진">&#8250;</button>
        </div>
        <div class="gallery__thumbs" id="galleryThumbs"></div>
      </div>
    </section>

    <!-- Closing Section -->
    <section class="section closing" id="closing">
      <div class="closing__photo animate-item" data-animate="fade-up">
        <img id="closingPhoto" src="" alt="웨딩 사진" loading="lazy">
      </div>
    </section>

    <!-- Account Section (축의금) -->
    <section class="section account" id="account">
      <div class="section__inner">
        <p class="section__eyebrow animate-item" data-animate="fade-up">ACCOUNT</p>
        <h2 class="section__title animate-item" data-animate="fade-up">마음 전하실 곳</h2>
        <p class="account__desc animate-item" data-animate="fade-up">참석이 어려우신 분들을 위해<br>계좌번호를 기재하였습니다.<br>너그러운 마음으로 양해 부탁드립니다.</p>

        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="groomAccordion" aria-expanded="false">
            <span>신랑측 계좌번호</span>
            <span class="accordion__arrow">&#8964;</span>
          </button>
          <div class="accordion__panel" id="groomAccordionPanel">
            <div class="accordion__panel-inner" id="groomAccountList"></div>
          </div>
        </div>

        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="brideAccordion" aria-expanded="false">
            <span>신부측 계좌번호</span>
            <span class="accordion__arrow">&#8964;</span>
          </button>
          <div class="accordion__panel" id="brideAccordionPanel">
            <div class="accordion__panel-inner" id="brideAccountList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn btn--pill footer__share" id="shareBtn">
        <span class="btn__icon">&#128279;</span> 청첩장 링크 공유하기
      </button>
      <p class="footer__text" id="footerText"></p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
